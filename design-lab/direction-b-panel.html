<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方向 B · 展签分栏 — 劳模室首屏样张</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#1677FF;--blue-h:#4096FF;--blue-a:#0958D9;
  --bg:#F5F7FA;--card:#FFFFFF;--line:#E3E8EF;
  --t1:#1F2329;--t2:#6B7280;--t3:#C0C6CF;--chip:#EDF1F6;--chip-t:#4A5261;
  --shadow:0 12px 32px rgba(15,23,42,.12);
}
html,body{height:100%}
body{font-family:"Microsoft YaHei","Segoe UI",-apple-system,"PingFang SC","HarmonyOS Sans",sans-serif;color:var(--t1);background:var(--bg);font-variant-numeric:tabular-nums}
.specbar{height:32px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--chip);border-bottom:1px solid var(--line);font-size:12px;color:var(--chip-t)}
.specbar b{font-weight:700;color:var(--blue)}
img.room{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.btn-primary{height:40px;padding:0 20px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s ease-out}
.btn-primary:hover{background:var(--blue-h)}
.btn-primary:active{background:var(--blue-a)}
.btn-ghost{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--t2);font-size:12px;cursor:pointer;transition:color .15s ease-out,border-color .15s ease-out}
.btn-ghost:hover{color:var(--t1);border-color:#C9D1DC}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;background:var(--chip);color:var(--chip-t);font-size:12px}
.hot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--blue);cursor:pointer;z-index:5}
.hot-label{position:absolute;left:28px;top:-8px;white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:8px 12px;display:none;z-index:6}
.hot-label strong{display:block;font-size:12px;font-weight:600;color:var(--t1)}
.hot-label span{display:block;font-size:12px;color:var(--t2);margin-top:2px}
.hot:hover .hot-label,.hot.active .hot-label{display:block}
.icon{width:14px;height:14px;stroke:var(--t2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.layout{display:flex;gap:24px;height:calc(100vh - 32px);padding:24px}
.viewport{position:relative;flex:1;border-radius:8px;overflow:hidden;box-shadow:var(--shadow);background:#0E1116}
.vp-chip{position:absolute;top:16px;left:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--t1);z-index:7}
.vp-chip span{font-weight:400;color:var(--t2);margin-left:8px}
.hot{box-shadow:0 0 0 6px rgba(22,119,255,.18)}
.hot.active{box-shadow:0 0 0 6px rgba(22,119,255,.30)}
.hint{position:absolute;left:16px;bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--t2);z-index:7}
.panel{width:400px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.tagrow{display:flex;gap:8px}
.panel h2{font-size:28px;line-height:1.4;font-weight:700}
.panel .meta{font-size:12px;color:var(--t2);margin-top:-8px}
.panel .body{font-size:14px;line-height:1.7;color:var(--t1)}
.media{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px}
.media-box{width:96px;height:54px;border-radius:4px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.media-box svg{width:20px;height:20px;stroke:var(--blue);fill:none;stroke-width:1.8}
.media-meta strong{display:block;font-size:14px;font-weight:600}
.media-meta span{display:block;font-size:12px;color:var(--t2);margin-top:2px}
.actions{display:flex;gap:12px;align-items:center;margin-top:auto}

</style>
</head>
