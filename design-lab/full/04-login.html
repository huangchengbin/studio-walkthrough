<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI-04 管理登录页 — v3 样张</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#1677FF;--blue-2:#4A95FF;--blue-deep:#0E5BD6;
  --ink:#17212B;--sub:#5B6B7C;--muted:#8A97A6;--line:#E1E7F0;--paper:#F2F5FA;
  --glass:linear-gradient(180deg,rgba(255,255,255,.97),rgba(245,249,254,.93));
  --shadow-1:0 1px 0 rgba(255,255,255,.85) inset,0 10px 30px -12px rgba(12,32,64,.22),0 2px 6px rgba(12,32,64,.06);
  --shadow-2:0 24px 70px -24px rgba(12,32,64,.38);
  --r-panel:14px;--r-ctl:9px;--r-tag:4px;
  --err:#FF4D4F;--warn:#FAAD14;
  --room:none;
}
html,body{height:100%}
body{font-family:"Microsoft YaHei","Segoe UI",-apple-system,"PingFang SC",sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.specbar{height:32px;display:flex;align-items:center;justify-content:center;gap:8px;background:#E9EEF6;border-bottom:1px solid var(--line);font-size:12px;color:#4A5A6B;letter-spacing:.04em}
.specbar b{font-weight:700;color:var(--blue)}
.stage{position:relative;height:calc(100vh - 32px);overflow:hidden;background:#0E1420}
.room{position:absolute;inset:0;background:var(--room) center/cover no-repeat}
.panel{background:var(--glass);border:1px solid rgba(255,255,255,.95);border-radius:var(--r-panel);box-shadow:var(--shadow-1)}
.topbar{position:absolute;top:0;left:0;right:0;z-index:10;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(246,249,253,.9));border-bottom:1px solid rgba(225,231,240,.9);box-shadow:0 8px 28px -18px rgba(12,32,64,.25)}
.identity{display:flex;align-items:center;gap:12px}
.brandmark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue-2),var(--blue));display:grid;place-items:center;box-shadow:0 3px 8px -2px rgba(22,119,255,.4)}
.brandmark svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.identity h1{font-size:19px;font-weight:700;letter-spacing:.08em}
.identity p{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.12em}
.identity p span{margin-left:8px;padding-left:8px;border-left:1px solid var(--line);color:var(--blue);font-weight:600}
.top-actions{display:flex;gap:10px;align-items:center}
.btn-primary{height:36px;padding:0 16px;border:0;border-radius:var(--r-ctl);background:linear-gradient(135deg,var(--blue-2),var(--blue));color:#fff;font-size:13px;font-weight:600;letter-spacing:.02em;cursor:pointer;box-shadow:0 6px 16px -8px rgba(22,119,255,.55);transition:transform .15s ease-out,filter .15s ease-out}
.btn-primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn-primary:active{filter:brightness(.96)}
.btn-outline{height:36px;padding:0 14px;border:1px solid #D8E2EF;border-radius:var(--r-ctl);background:rgba(255,255,255,.85);color:var(--sub);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.btn-outline:hover{border-color:var(--blue);color:var(--blue)}
.btn-primary,.btn-outline{white-space:nowrap}
.btn-primary svg,.btn-outline svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{width:38px;height:38px;border:1px solid rgba(255,255,255,.9);border-radius:10px;background:var(--glass);box-shadow:var(--shadow-1);display:grid;place-items:center;cursor:pointer;transition:transform .15s,background .15s}
.icon-btn:hover{background:#fff;transform:translateY(-1px)}
.icon-btn svg{width:18px;height:18px;stroke:var(--sub);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:600}
.tag{display:inline-flex;height:22px;padding:0 8px;align-items:center;border-radius:var(--r-tag);background:#EDF2F9;color:#4A5A6B;font-size:12px}
.segment{display:flex;gap:3px;padding:4px;background:#E9EEF6;border-radius:10px;box-shadow:inset 0 1px 2px rgba(12,32,64,.08)}
.segment button{height:30px;padding:0 14px;border:0;border-radius:7px;background:none;font-size:12px;color:var(--sub);cursor:pointer;transition:all .16s}
.segment button.selected{background:#fff;color:var(--blue);font-weight:650;box-shadow:0 1px 2px rgba(12,32,64,.12),0 4px 12px -6px rgba(12,32,64,.25)}
.hint-pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(16,32,52,.62);color:#F2F6FA;font-size:11px;letter-spacing:.06em}
.hint-pill span{color:#9FB2C6}
.rail{position:absolute;left:24px;top:96px;width:252px;max-height:calc(100% - 352px);overflow:auto;padding:12px 9px 8px;z-index:8}
.rail-title{padding:1px 8px 8px}
.rail-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border:0;border-radius:9px;background:none;cursor:pointer;text-align:left;transition:background .16s}
.rail-item:hover{background:#EAF1F9}
.rail-item .badge{flex:0 0 26px;height:28px;display:grid;place-items:center;border-radius:7px;background:#EDF2F9;color:#4A5A6B;font-size:12px;font-weight:600;box-shadow:inset 0 0 0 1px #E1E7F0}
.rail-item strong{display:block;font-size:12px;font-weight:600}
.rail-item small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.rail-item.active{background:linear-gradient(135deg,var(--blue-2),var(--blue));color:#fff;box-shadow:0 6px 16px -8px rgba(22,119,255,.6)}
.rail-item.active small{color:#DCEBFF}
.rail-item.active .badge{background:rgba(255,255,255,.15);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.plan{position:absolute;left:24px;bottom:24px;width:248px;padding:12px 12px 9px;z-index:8}
.plan-top{display:flex;justify-content:space-between;align-items:center;font-size:11px}
.plan-top b{font-weight:600}
.plan svg{width:100%;height:148px;display:block;margin-top:6px;background:#F7FAFE;border-radius:8px;border:1px solid var(--line)}
.plan p{font-size:10px;color:var(--muted);text-align:center;margin-top:6px}
.dock{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:8px;padding:8px 10px}
.dock-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--sub);font-size:12px;cursor:pointer}
.dock-btn:hover{background:#EAF1F9}
.dock-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dock .divider{width:1px;height:20px;background:var(--line)}
.gesture{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);z-index:8}
.hot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 6px rgba(22,119,255,.18);cursor:pointer;z-index:5}
.hot::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid rgba(22,119,255,.4);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:.9}70%{transform:scale(1.1);opacity:0}100%{opacity:0}}
.hot-label{position:absolute;left:28px;top:-8px;white-space:nowrap;background:var(--glass);border:1px solid rgba(255,255,255,.95);border-radius:9px;box-shadow:var(--shadow-1);padding:8px 12px;display:none;z-index:6}
.hot-label strong{display:block;font-size:12px;font-weight:600;color:var(--ink)}
.hot-label span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.hot:hover .hot-label,.hot.active .hot-label{display:block}
.drawer{position:absolute;top:96px;right:24px;bottom:24px;width:400px;z-index:20;display:flex;flex-direction:column;overflow:hidden}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.drawer-body{padding:18px 22px;overflow:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.drawer-foot{padding:14px 22px 18px;border-top:1px solid var(--line)}
.scrim{position:absolute;inset:0;background:rgba(14,22,32,.28);z-index:15}
h2.title{font-size:26px;line-height:1.4;font-weight:700;letter-spacing:.01em}
.media{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;background:rgba(255,255,255,.6)}
.media-thumb{width:96px;height:54px;border-radius:6px;flex:none;background:var(--room) center/300% auto;display:grid;place-items:center}
.media-thumb svg{width:20px;height:20px;stroke:#fff;fill:rgba(16,32,52,.4);stroke-width:1.8}
.field label{display:block;font-size:12px;color:#4A5A6B;margin-bottom:5px;letter-spacing:.04em}
.input{height:40px;width:100%;border:1px solid #D8E2EF;border-radius:var(--r-ctl);padding:0 12px;font-size:14px;color:var(--ink);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,119,255,.12)}

.loginwrap{height:calc(100vh - 32px);display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 30%,#FAFCFE,#E9EFF7);position:relative}
.corner-brand{position:absolute;top:24px;left:24px;display:flex;align-items:center;gap:10px}
.corner-brand .brandmark{width:30px;height:30px;border-radius:8px}
.corner-brand strong{font-size:12px;font-weight:700;letter-spacing:.08em}
.corner-brand span{font-size:10px;color:var(--muted);letter-spacing:.12em;margin-left:6px}
.login-card{width:400px;padding:34px 32px 30px;border-radius:16px}
.login-card .eyebrow{text-align:center;margin-bottom:10px}
.login-card h1{font-size:22px;font-weight:700;text-align:center;letter-spacing:.06em}
.login-card .sub{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;letter-spacing:.06em}
.login-card .fields{margin-top:26px;display:flex;flex-direction:column;gap:16px}
.back{display:block;text-align:center;font-size:12px;color:var(--blue);text-decoration:none;margin-top:16px;letter-spacing:.04em}

</style>
</head>
<body>

<div class="specbar"><b>视觉 v3</b> · 蓝系 + V07 质感 · 导览型布局 — UI-04 管理登录页（静态样张）</div>
<div class="loginwrap">
  <div class="corner-brand"><span class="brandmark"><svg viewBox="0 0 24 24"><path d="M4 10l8-6 8 6v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M9 14h6M9 17h6"/></svg></span><strong>劳模创新工作室</strong><span>3D 数字展厅</span></div>
  <div class="panel login-card">
    <div class="eyebrow">MANAGE · 管理入口</div>
    <h1>管理登录</h1>
    <p class="sub">仅限布展管理员使用 · 凭据线下重置</p>
    <div class="fields">
      <div class="field"><label>账号</label><input class="input" type="text" placeholder="请输入账号"></div>
      <div class="field"><label>密码</label><input class="input" type="password" placeholder="请输入密码"></div>
      <button class="btn-primary" style="width:100%;height:40px;margin-top:6px">登录</button>
    </div>
    <a class="back" href="02-scene.html">返回参观</a>
  </div>
</div>
<script>
document.querySelectorAll('.hot').forEach(function(h){h.addEventListener('click',function(e){document.querySelectorAll('.hot').forEach(function(x){x.classList.remove('active')});h.classList.add('active');e.stopPropagation()})});
document.querySelectorAll('.segment').forEach(function(s){s.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){s.querySelectorAll('button').forEach(function(x){x.classList.remove('selected')});b.classList.add('selected')})})});
document.querySelectorAll('.rail-item').forEach(function(r){r.addEventListener('click',function(){document.querySelectorAll('.rail-item').forEach(function(x){x.classList.remove('active')});r.classList.add('active')})});
document.querySelectorAll('[data-close]').forEach(function(b){b.addEventListener('click',function(){var el=document.getElementById(b.getAttribute('data-close'));if(el)el.style.display='none';var s=document.querySelector('.scrim');if(s)s.style.display='none'})});
</script>
</body>
</html>
